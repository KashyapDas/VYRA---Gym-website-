<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>VYRA — Premium Movement Coaching</title>

    <meta
      name="description"
      content="A premium fitness coaching website concept featuring responsive design, interactive booking, WhatsApp integration and modern animations."
    />

    <meta
      name="theme-color"
      content="#0b0b0b"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph information -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="VYRA"
    />

    <meta
      property="og:title"
      content="VYRA — Premium Movement Coaching"
    />

    <meta
      property="og:description"
      content="A premium fitness and appointment-booking website concept built with React, Tailwind CSS, GSAP and Lenis."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <!-- Twitter/X sharing information -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="VYRA — Premium Movement Coaching"
    />

    <meta
      name="twitter:description"
      content="A premium fitness and appointment-booking website concept built with React, Tailwind CSS, GSAP and Lenis."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <!-- Website favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Preload the Hero/LCP image -->
    <link
      rel="preload"
      as="image"
      href="/images/hero.webp"
      fetchpriority="high"
    />


    <!-- Google Fonts connection -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Website fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
